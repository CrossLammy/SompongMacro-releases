name: แจ้ง Release เข้า Discord

on:
  release:
    types: [released]   # Publish ตัวจริงเท่านั้น (ข้าม pre-release / draft)
  workflow_dispatch:     # ปุ่มกดส่งเองในแท็บ Actions
    inputs:
      tag:
        description: "เวอร์ชันที่จะประกาศ เช่น v1.2"
        required: true

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: ส่งข้อความเข้า Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.tag }}
        run: |
          # กดส่งเอง = ดึงข้อมูล Release จาก tag ที่พิมพ์ · ปกติ = ใช้ข้อมูลจากตอน Publish
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG_IN" \
              | jq '{release: .}' > ev.json
          else
            cp "$GITHUB_EVENT_PATH" ev.json
          fi

          TAG=$(jq -r '.release.tag_name' ev.json)
          BODY=$(jq -r '.release.body // ""' ev.json | tr -d '\r')

          # เอาเฉพาะหัวข้อ "มีอะไรใหม่" (ถึงหัวข้อถัดไป) · ตัดบรรทัดว่าง / ** / ```
          NEW=$(printf '%s\n' "$BODY" | awk '/^#+ /{f=($0 ~ /มีอะไรใหม่/); next} f' \
                | sed -e '/^[[:space:]]*$/d' -e 's/\*\*//g' -e 's/```//g')
          [ -z "$NEW" ] && NEW="$BODY"
          NEW=${NEW:0:1700}   # Discord ให้ข้อความไม่เกิน 2000 ตัวอักษร

          jq -n --arg tag "$TAG" --arg new "$NEW" '{
            username: "SompongMacro",
            content: ("@everyone\n## 📢 อัปเดต SompongMacro " + $tag + "\n```\n" + $new + "\n```"),
            allowed_mentions: { parse: ["everyone"] }
          }' > payload.json

          curl -sf -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
